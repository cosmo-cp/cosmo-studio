name: Build PR

on:
    pull_request:
        branches:
            - main
        types:
            - opened
            - synchronize
            - reopened

jobs:
    pr-ubuntu:
        name: PR checks (ubuntu-latest)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '26.13.0'

            - name: Install dependencies
              run: npm install

            - name: Run root lint
              run: npm run lint

            - name: Run renderer lint
              run: npm run lint --prefix apps/cosmo-web

            - name: Run root tests
              run: npm run test

            - name: Run renderer tests
              run: npm run test --prefix apps/cosmo-web

            - name: Run root tests (coverage)
              run: npm run test:coverage

            - name: Run renderer tests (coverage)
              run: npm run test:coverage --prefix apps/cosmo-web

            - name: Upload coverage artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: coverage-ubuntu-latest
                  path: |
                      coverage
                      apps/cosmo-web/coverage

            - name: Package application
              env:
                  ENABLE_MAC_SIGNING: 'false'
              run: npm run package

            - name: Upload package artifact
              uses: actions/upload-artifact@v4
              with:
                  name: package-ubuntu-latest
                  path: out
